<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,400;0,700;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
  <title>Currency Converter</title>
</head>

<body>
  <div class="container">
    <header>
      <h1>Currency Converter</h1>
    </header>

    <main>
      <label>
        Converter <b>to</b>
        <select>
          <option>
            US$ American Dollar
          </option>
          <option>
            € Euro
          </option>
          <option>
            Ƀ BitCoin
          </option>
          <option>
            ¥ Japanese Yen
          </option>
          <option>
            ₹ Indian Rupee
          </option>
          <option>
            ₩ South Korean Won
          </option>
          <option>
            £ British Pound
          </option>
          <option>
            ₱ Philippine Peso
          </option>
          <option>
            A$ Australian Dollar
          </option>
          <option>
            C$ Canadian Dollar
          </option>
          <option>
            CHF Swiss Franc
          </option>
          <option>
            R$ Brazilian Real
          </option>
          <option>
            ₽ Russian Ruble
          </option>
          <option>
            ₦ Nigerian Naira
          </option>
          <option>
            ₫ Vietnamese Dong
          </option>
          <option>
            ₴ Ukrainian Hryvnia
          </option>
          <option>
            ₺ Turkish Lira
          </option>
          <option>
            ₪ Israeli Shekel
          </option>
          <option>
            ₳ Argentine Peso
          </option>
          <option>
            ₵ Ghanaian Cedi
          </option>
          <option>
            ₭ Laotian Kip
          </option>
          <option>
            ₮ Mongolian Tögrög
          </option>
          <option>
            ₱ Pakistani Rupee
          </option>
          <option>
            ₲ Paraguayan Guarani
          </option>
          <option>
            ₵ Kenyan Shilling
          </option>
          <option>
            ₸ Kazakhstani Tenge
          </option>
          <option>
            ₼ Azerbaijani Manat
          </option>
          <option>
            ₾ Georgian Lari
          </option>
        </select>
      </label>

      <label>
        Converter <b>for</b>
        <select id="currency-select">
          <option>
            US$ American Dollar
          </option>
          <option>
            € Euro
          </option>
          <option>
            Ƀ BitCoin
          </option>
          <option>
            ¥ Japanese Yen
          </option>
          <option>
            ₹ Indian Rupee
          </option>
          <option>
            ₩ South Korean Won
          </option>
          <option>
            £ British Pound
          </option>
          <option>
            ₱ Philippine Peso
          </option>
          <option>
            A$ Australian Dollar
          </option>
          <option>
            C$ Canadian Dollar
          </option>
          <option>
            CHF Swiss Franc
          </option>
          <option>
            R$ Brazilian Real
          </option>
          <option>
            ₽ Russian Ruble
          </option>
          <option>
            ₦ Nigerian Naira
          </option>
          <option>
            ₫ Vietnamese Dong
          </option>
          <option>
            ₴ Ukrainian Hryvnia
          </option>
          <option>
            ₺ Turkish Lira
          </option>
          <option>
            ₪ Israeli Shekel
          </option>
          <option>
            ₳ Argentine Peso
          </option>
          <option>
            ₵ Ghanaian Cedi
          </option>
          <option>
            ₭ Laotian Kip
          </option>
          <option>
            ₮ Mongolian Tögrög
          </option>
          <option>
            ₱ Pakistani Rupee
          </option>
          <option>
            ₲ Paraguayan Guarani
          </option>
          <option>
            ₵ Kenyan Shilling
          </option>
          <option>
            ₸ Kazakhstani Tenge
          </option>
          <option>
            ₼ Azerbaijani Manat
          </option>
          <option>
            ₾ Georgian Lari
          </option>
        </select>
      </label>

      <label>
        Value
        <input id="input-real" type="number" placeholder="Enter the value to convert">
      </label>

      <button id="convert-button" type="button">Convert</button>

      <section>
        <div class="currency-container">
          <img src="./assets/Real.svg" alt="Brazil flag">
          <p class="currency-name">Real</p>
          <p class="currency-value" id="real-value-text">R$ 1.000,00</p>
        </div>

        <div class="currency-container">
          <img src="./assets/Dolar.svg" alt="U.S.A flag">
          <p class="currency-name">Dollar</p>
          <p class="currency-value" id="real-value-text">$ 1.000,00</p>
        </div>

        <div class="currency-container">
          <img src="./assets/Bitcoin.svg" alt="Bitcoin flag">
          <p class="currency-name">BTC</p>
          <p class="currency-value" id="real-value-text">₿ 1.000,00</p>
        </div>


        <img class="arrow-img" src="./assets/Arrow.png" alt="Arrow pointing down">

        <div class="currency-container">
          <img src="./assets/Dolar.svg" id="currency-img" alt="Country flag for conversion">
          <p class="currency-name" id="currency-name">American Dollar</p>
          <p class="currency-value" id="currency-value-text">US$ 2.000,00</p>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
