<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,400;0,700;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
  <title>Currency Converter</title>
</head>

<body>
  <div class="container">
    <header>
      <h1>Currency Converter</h1>
    </header>

    <main>
      <label>
        Converter <b>to</b>
        <select>
          <option>
            R$ Brasialian Real
          </option>
        </select>
      </label>

      <label>
        Converter <b>for</b>
        <select id="currency-select">
          <option>
            US$ American Dollar
          </option>
          <option>
            € Euro
          </option>
          <option>
            Ƀ BitCoin
          </option>
        </select>
      </label>

      <label>
        Value
        <input id="input-real" type="number" placeholder="Enter the value to convert">
      </label>

      <button id="convert-button" type="button">Convert</button>

      <section>
        <div class="currency-container">
          <img src="./assets/Real.svg" alt="Brazil flag">
          <p class="currency-name">Real</p>
          <p class="currency-value" id="real-value-text">R$ 10.000,00</p>
        </div>

        <img class="arrow-img" src="./assets/Arrow.png" alt="Arrow pointing down">

        <div class="currency-container">
          <img src="./assets/Dolar.svg" id="currency-img" alt="Country flag for conversion">
          <p class="currency-name" id="currency-name">American Dollar</p>
          <p class="currency-value" id="currency-value-text">US$ 2.000,00</p>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
